name: Dummy test - send policy reminders

on:
  schedule:
    # Every weekday at 14:05 UTC = 7:05 PM Pakistan time (this is the real-project timer)
    - cron: "5 14 * * 1-5"
    # One extra test TODAY (2 Nov) at 15:25 UTC = 8:25 PM Pakistan time
    - cron: "25 15 2 11 *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = only print | send-now = really send to Discord right now"
        type: choice
        options:
          - dry-run
          - send-now
        default: dry-run
      date:
        description: "Optional: pretend today is this date (YYYY-MM-DD), e.g. 2026-11-02"
        required: false
        default: ""

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Run
        env:
          WEBHOOK_PRESTIGE: ${{ secrets.WEBHOOK_PRESTIGE }}
          MODE: ${{ github.event.inputs.mode }}
          FAKE_DATE: ${{ github.event.inputs.date }}
        run: |
          # Scheduled runs have no inputs: they send today's policy, and only after 7 PM Pakistan time.
          ARGS=""
          if [ "$MODE" = "dry-run" ]; then ARGS="--dry-run"; fi
          if [ "$MODE" = "send-now" ]; then ARGS="--now"; fi
          if [ -n "$FAKE_DATE" ]; then ARGS="$ARGS --date $FAKE_DATE"; fi
          python dummy_sender.py $ARGS
